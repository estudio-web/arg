<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Control de ganancias - IN-STORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
      :root{
        /* Paleta igual a index.html */
        --yellow:#ffe600;
        --yellow-dk:#f0d000;
        --blue:#3483fa;
        --blue-dk:#2968c8;
        --green:#00a650;
        --green-dk:#007a3d;
        --red:#e83030;
        --orange:#f97316;

        --text:#333;
        --muted:#666;
        --border:#e8e8e8;
        --bg:#ededed;
        --white:#fff;

        --shadow:0 1px 2px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.08);
        --shadow-lg:0 4px 16px rgba(0,0,0,.18);
        --radius:14px;
      }
    *{box-sizing:border-box;margin:0;padding:0}
      body{font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    a{color:inherit}

      .topbar{
        position:sticky;top:0;z-index:50;
        background:var(--yellow);
        border-bottom:1px solid rgba(0,0,0,.08);
        box-shadow:0 2px 6px rgba(0,0,0,.15);
      }
    .topbar-inner{
      max-width:1100px;margin:0 auto;
      padding:12px 12px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    }
    .brand{display:flex;align-items:center;gap:10px}
    .logo{font-weight:900;letter-spacing:.3px}
    .title{font-weight:900}
      .sub{font-size:.82rem;color:rgba(0,0,0,.6);font-weight:800}
      .btn{
        border:1px solid rgba(0,0,0,.10);
        background:rgba(0,0,0,.06);
        color:var(--text);
        padding:10px 12px;border-radius:10px;
        font-weight:900;cursor:pointer;
        display:inline-flex;align-items:center;justify-content:center;gap:8px;
      }
      .btn:active{transform:scale(.99)}
      .btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
      .btn-primary:hover{background:var(--blue-dk);border-color:var(--blue-dk)}

    .wrap{max-width:1100px;margin:0 auto;padding:14px 12px 70px}

    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      margin-top:12px;
    }
    @media (min-width: 880px){
      .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
    }
      .stat{
        background:var(--white);
        border:1px solid var(--border);
        border-radius:var(--radius);
        padding:12px;
        box-shadow: var(--shadow);
        min-height:84px;
        display:flex;flex-direction:column;justify-content:space-between;
      }
      .stat-label{font-size:.74rem;color:var(--muted);font-weight:900}
    .stat-val{font-size:1.25rem;font-weight:900;letter-spacing:.2px}
    .stat-val.good{color:var(--green)}
    .stat-val.bad{color:var(--red)}

      .section{
        margin-top:14px;
        background:var(--white);
        border:1px solid var(--border);
        border-radius:var(--radius);
        padding:12px;
        box-shadow: var(--shadow);
      }
    .section h2{
      font-size:1rem;font-weight:900;margin-bottom:8px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    }
    .hint{font-size:.82rem;color:var(--muted);font-weight:700}

    .list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
      .p-card{
        border:1px solid var(--border);
        background:var(--white);
        border-radius:var(--radius);
        padding:12px;
        display:flex;gap:12px;align-items:flex-start;
        cursor:pointer;
      }
      .p-card:active{transform:scale(.997)}
      .thumb{
        width:64px;height:64px;border-radius:12px;flex-shrink:0;
        background:var(--bg);
        object-fit:cover;
        border:1px solid var(--border);
      }
    .p-main{min-width:0;flex:1}
    .p-name{font-weight:900;font-size:.96rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .p-meta{margin-top:2px;font-size:.78rem;color:var(--muted);font-weight:800}

    .form{
      margin-top:10px;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }
    @media (min-width: 880px){
      .form{grid-template-columns:repeat(5,minmax(0,1fr))}
    }
    .field{display:flex;flex-direction:column;gap:5px}
    .field label{font-size:.72rem;color:var(--muted);font-weight:900}
      .field input, .field textarea{
        width:100%;
        border:1px solid var(--border);
        background:var(--white);
        color:var(--text);
        padding:10px 10px;border-radius:10px;
        font-weight:800;
        outline:none;
      }
      .field input:focus, .field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(52,131,250,.15)}
    .field textarea{min-height:42px;resize:vertical}

    .calc{
      margin-top:10px;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      align-items:end;
    }
    @media (min-width: 880px){
      .calc{grid-template-columns:repeat(4,minmax(0,1fr))}
    }
      .calc-result{
        grid-column:1 / -1;
        padding:10px 12px;border-radius:12px;
        border:1px solid var(--border);
        background:var(--white);
        font-weight:900;
        display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
      }
    .pill{font-size:.78rem;color:var(--muted);font-weight:900}

    .p-bottom{
      margin-top:10px;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:10px;
      flex-wrap:wrap;
    }
      .num{
        border:1px solid var(--border);
        background:#fafafa;
        padding:8px 10px;border-radius:999px;
        font-size:.78rem;font-weight:900;color:var(--muted);
        white-space:nowrap;
      }
    .num strong{color:var(--text)}

    .toast{
      position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
      background:rgba(0,0,0,.82);
      border:1px solid rgba(255,255,255,.12);
      color:var(--text);
      padding:10px 12px;border-radius:12px;
      font-weight:900;font-size:.84rem;
      display:none;
      z-index:999;
      max-width:92vw;
    }
    .toast.show{display:block}
    .center{padding:40px 14px;text-align:center;color:var(--muted);font-weight:800}

    /* Lista minimal: solo producto + botones. Edicion completa en modal. */
    .p-meta{font-size:.78rem;color:var(--muted);font-weight:800;margin-top:2px}
    .p-actions{display:flex;gap:8px;flex-wrap:wrap}
    .p-actions .btn{flex:1;min-width:120px}
    @media (max-width: 520px){
      .thumb{width:54px;height:54px}
      .p-actions .btn{min-width:unset}
    }

    .modal{
      position:fixed;inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:flex-end;
      justify-content:center;
      z-index:2000;
    }
    .modal.open{display:flex}
      .sheet{
        width:100%;
        max-width:720px;
        background:var(--white);
        border:1px solid var(--border);
        border-radius:18px 18px 0 0;
        box-shadow: var(--shadow-lg);
        padding:12px 12px 16px;
        max-height:92vh;
        overflow:auto;
      }
    .sheet-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .sheet-title{font-weight:900;font-size:1rem}
    .sheet-sub{color:var(--muted);font-weight:800;font-size:.8rem;margin-top:2px}
    .xbtn{width:40px;height:40px;border-radius:12px;background-color: red;COLOR:var(--bg)}
      .sheet-preview{
        margin-top:10px;
        display:flex;gap:10px;align-items:center;
        border:1px solid var(--border);
        background:#fafafa;
        border-radius:14px;
        padding:10px;
      }
      .sheet-preview img{width:56px;height:56px;border-radius:12px;object-fit:cover;border:1px solid var(--border)}
    .sheet-grid{
      margin-top:10px;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }
    @media (min-width: 560px){
      .sheet-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
    .sheet-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .sheet-actions .btn{flex:1}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div>
          <div class="logo">IN-STORE</div>
          <div class="sub">Control de ganancias</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="btnBack">Volver</button>
        <button class="btn btn-primary" id="btnRefresh">Actualizar</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div id="loading" class="center">Cargando productos...</div>

    <div id="app" style="display:none">
      <div class="grid" id="summaryGrid"></div>

      <div class="section">
        <h2>
          <span>Calculadora rapida</span>
          <span class="hint">Saca la ganancia de una venta en segundos</span>
        </h2>

        <div class="calc">
          <div class="field">
            <label>Costo</label>
            <input id="calcCost" inputmode="decimal" placeholder="0" />
          </div>
          <div class="field">
            <label>Precio venta</label>
            <input id="calcPrice" inputmode="decimal" placeholder="0" />
          </div>
          <div class="field">
            <label>Cantidad</label>
            <input id="calcQty" inputmode="numeric" placeholder="1" />
          </div>
          <button class="btn btn-primary" id="btnCalc">Calcular</button>
          <div class="calc-result" id="calcResult">
            <div>
              <div class="pill">Resultado</div>
              <div id="calcResultMain" style="font-size:1.05rem;font-weight:900">Ganancia: $0</div>
            </div>
            <div id="calcResultSub" class="pill">Por unidad: $0</div>
          </div>
        </div>
      </div>

      <div class="section">
        <h2>
          <span>Productos</span>
          <span class="hint">Edita costo, precio, stock y ventas</span>
        </h2>
        <div class="list" id="productList"></div>
        <div id="empty" class="center" style="display:none">No hay productos cargados.</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal" id="productModal" role="dialog" aria-modal="true">
    <div class="sheet">
      <div class="sheet-top">
        <div style="min-width:0;flex:1">
          <div class="sheet-title" id="mTitle">Producto</div>
          <div class="sheet-sub" id="mSub"></div>
        </div>
        <button class="btn xbtn" id="mClose" aria-label="Cerrar">X</button>
      </div>
      <div class="sheet-preview">
        <img id="mImg" alt="">
        <div style="min-width:0;flex:1">
          <div class="pill">Ganancia estimada</div>
          <div id="mProfit" style="font-weight:900;font-size:1.05rem;margin-top:2px">$0</div>
          <div id="mProfitSub" class="pill" style="margin-top:2px">Por unidad: $0</div>
        </div>
      </div>
      <div class="sheet-grid">
        <div class="field">
          <label>Costo unitario</label>
          <input id="mCost" inputmode="decimal" placeholder="0">
        </div>
        <div class="field">
          <label>Precio de venta</label>
          <input id="mPrice" inputmode="decimal" placeholder="0">
        </div>
        <div class="field">
          <label>Stock</label>
          <input id="mStock" inputmode="numeric" placeholder="0">
        </div>
        <div class="field">
          <label>Cantidad vendida</label>
          <input id="mSold" inputmode="numeric" placeholder="0">
        </div>
        <div class="field" style="grid-column:1 / -1">
          <label>Nota (opcional)</label>
          <textarea id="mNote" placeholder="Ej: proveedor, observaciones..."></textarea>
        </div>
      </div>
      <div class="sheet-actions">
        <button class="btn" id="mCancel">Cancelar</button>
        <button class="btn btn-primary" id="mSave">Guardar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, doc, updateDoc, onSnapshot, getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    let tenantId = params.get("t");
    let products = [];
    let unsubProducts = null;
    let modalProductId = null;
    const drafts = {}; // productId -> { costUnit, price, stock, soldQty, gainNote }

    const PLACEHOLDER = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">
        <rect width="100%" height="100%" fill="#ededed"/>
        <text x="50%" y="52%" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">Sin imagen</text>
      </svg>
    `);

    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 1800);
    }

    function n(v) {
      if (typeof v === "number") return Number.isFinite(v) ? v : 0;
      let raw = String(v ?? "").replace(/[^\d,.-]/g, "");
      if (!raw) return 0;
      const lastComma = raw.lastIndexOf(",");
      const lastDot = raw.lastIndexOf(".");
      if (lastComma !== -1 && lastDot !== -1) {
        // Ambos presentes: el que aparece último es el separador decimal
        const decimalSep = lastComma > lastDot ? "," : ".";
        const thousandsSep = decimalSep === "," ? "." : ",";
        raw = raw.replace(new RegExp("\\" + thousandsSep, "g"), "").replace(decimalSep, ".");
      } else if (lastComma !== -1) {
        const parts = raw.split(",");
        raw = parts.length === 2 && parts[1].length === 3 ? parts.join("") : raw.replace(",", ".");
      } else if (lastDot !== -1) {
        // "10.000" (miles) vs "10.5" (decimal): si el grupo final tiene 3 dígitos, es separador de miles
        const parts = raw.split(".");
        const isThousands = parts.length > 2 || (parts.length === 2 && parts[1].length === 3);
        raw = isThousands ? parts.join("") : raw;
      }
      const x = Number(raw);
      return Number.isFinite(x) ? x : 0;
    }

    function i(v) {
      const x = parseInt(String(v ?? "").replace(/[^\d-]/g, ""), 10);
      return Number.isFinite(x) ? x : 0;
    }

    function money(v) {
      const num = Math.round((Number(v) || 0) * 100) / 100;
      try {
        return new Intl.NumberFormat("es-AR", { maximumFractionDigits: 2 }).format(num);
      } catch {
        return String(num);
      }
    }

    function imgOf(p) {
      const img = (Array.isArray(p.images) && p.images[0]) ? p.images[0] : p.imageUrl;
      return img || PLACEHOLDER;
    }

    function compute(p) {
      const cost = n(p.costUnit ?? p.cost ?? 0);
      const price = n(p.price ?? 0);
      const stock = i(p.stock ?? 0);
      const sold = i(p.soldQty ?? 0);

      const profitUnit = price - cost;
      const profitTotal = profitUnit * sold;
      const soldTotal = price * sold;
      const investTotal = cost * (stock + sold);

      return { cost, price, stock, sold, profitUnit, profitTotal, soldTotal, investTotal };
    }

    function renderSummary() {
      const totals = products.reduce((acc, p) => {
        const c = compute(p);
        acc.invest += c.investTotal;
        acc.sold += c.soldTotal;
        acc.profit += c.profitTotal;
        acc.soldUnits += c.sold;
        acc.stock += c.stock;
        return acc;
      }, { invest:0, sold:0, profit:0, soldUnits:0, stock:0 });

      const grid = $("summaryGrid");
      const profitClass = totals.profit >= 0 ? "good" : "bad";
      grid.innerHTML = `
        <div class="stat">
          <div class="stat-label">Total invertido</div>
          <div class="stat-val">$${money(totals.invest)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Total vendido</div>
          <div class="stat-val">$${money(totals.sold)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Ganancia estimada</div>
          <div class="stat-val ${profitClass}">$${money(totals.profit)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Productos vendidos</div>
          <div class="stat-val">${money(totals.soldUnits)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Stock restante</div>
          <div class="stat-val">${money(totals.stock)}</div>
        </div>
      `;
    }

    function productCard(p) {
      const c = compute(p);
      const note = String(p.gainNote ?? p.profitNote ?? p.internalNote ?? "").slice(0, 500);
      const smallId = `p_${p.id}`;

      return `
        <div class="p-card" data-id="${p.id}">
          <img class="thumb" src="${imgOf(p)}" alt="">
          <div class="p-main">
            <div class="p-name">${escapeHtml(p.title || p.name || "Producto")}</div>
            <div class="p-meta">${escapeHtml(p.category || "")}</div>

            <div class="p-bottom">
              <div class="p-actions">
                <button class="btn btn-primary" data-action="edit" data-id="${p.id}">Editar</button>
                <button class="btn" data-action="saveDraft" data-id="${p.id}" ${drafts[p.id] ? "" : "disabled"}>Guardar</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function escapeHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderProducts() {
      const listEl = $("productList");
      $("empty").style.display = products.length ? "none" : "block";
      listEl.innerHTML = products.map(productCard).join("");
      renderSummary();
    }

    async function saveDraft(productId) {
      const d = drafts[productId];
      if (!d) { toast("No hay cambios para guardar"); return; }
      try {
        await updateDoc(doc(db, `tenants/${tenantId}/products/${productId}`), {
          costUnit: n(d.costUnit),
          price: n(d.price),
          stock: i(d.stock),
          soldQty: i(d.soldQty),
          gainNote: String(d.gainNote || "").slice(0, 500),
        });
        delete drafts[productId];
        toast("Guardado");
        renderProducts();
      } catch (e) {
        console.error(e);
        toast("No se pudo guardar");
      }
    }

    function wireProductActions() {
      $("productList").addEventListener("click", (ev) => {
        const btn = ev.target?.closest?.("[data-action]");
        if (!btn) return;
        const action = btn.dataset.action;
        const pid = btn.dataset.id;
        if (action === "edit") openProductModal(pid);
        if (action === "saveDraft") saveDraft(pid);
      });
    }

    function runCalc() {
      const cost = n($("calcCost").value);
      const price = n($("calcPrice").value);
      const qty = Math.max(0, i($("calcQty").value || 1));
      const per = price - cost;
      const total = per * qty;
      $("calcResultMain").textContent = `Ganancia: $${money(total)}`;
      $("calcResultSub").textContent = `Por unidad: $${money(per)}`;
    }

    $("btnCalc").onclick = runCalc;
    ["calcCost","calcPrice","calcQty"].forEach(id => {
      $(id).addEventListener("input", () => {
        // No spamear calculos si esta vacio
        runCalc();
      });
    });

    $("btnBack").onclick = () => {
      const base = location.pathname.replace(/internal\.html$/i, "");
      const url = base + "admin.html" + (tenantId ? ("?t=" + encodeURIComponent(tenantId)) : "");
      location.href = url;
    };
    $("btnRefresh").onclick = () => {
      renderProducts();
      toast("Actualizado");
    };

    wireProductActions();

    async function resolveTenantId(user) {
      if (tenantId) return tenantId;
      try {
        const snap = await getDoc(doc(db, `users/${user.uid}`));
        tenantId = snap.exists() ? (snap.data().tenantId || user.uid) : user.uid;
      } catch {
        tenantId = user.uid;
      }
      return tenantId;
    }

    function startProductsListener() {
      if (unsubProducts) unsubProducts();
      unsubProducts = onSnapshot(collection(db, `tenants/${tenantId}/products`), snap => {
        products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        $("loading").style.display = "none";
        $("app").style.display = "block";
        renderProducts();
      }, err => {
        console.error(err);
        $("loading").textContent = "No se pudo cargar. Revisa tu sesion o permisos.";
      });
    }

    function openProductModal(productId) {
      const p = products.find(x => x.id === productId);
      if (!p) return;
      modalProductId = productId;
      const c = compute(p);
      const d = drafts[productId] || null;
      $("mTitle").textContent = p.title || p.name || "Producto";
      $("mSub").textContent = p.category || "";
      $("mImg").src = imgOf(p);
      $("mCost").value = d ? String(d.costUnit ?? "") : (c.cost ? String(c.cost) : "");
      $("mPrice").value = d ? String(d.price ?? "") : (c.price ? String(c.price) : "");
      $("mStock").value = d ? String(d.stock ?? 0) : String(c.stock);
      $("mSold").value = d ? String(d.soldQty ?? 0) : String(c.sold);
      $("mNote").value = d ? String(d.gainNote ?? "") : String(p.gainNote ?? p.profitNote ?? p.internalNote ?? "");
      updateModalPreview();
      $("productModal").classList.add("open");
    }

    function closeProductModal() {
      $("productModal").classList.remove("open");
      modalProductId = null;
    }

    function updateModalPreview() {
      if (!modalProductId) return;
      const cost = n($("mCost").value);
      const price = n($("mPrice").value);
      const sold = i($("mSold").value);
      const per = price - cost;
      const total = per * sold;
      $("mProfit").textContent = `$${money(total)}`;
      $("mProfitSub").textContent = `Por unidad: $${money(per)}`;

      // guardar draft en vivo, para habilitar "Guardar" en la lista sin ocupar espacio
      drafts[modalProductId] = {
        costUnit: cost,
        price: price,
        stock: i($("mStock").value),
        soldQty: sold,
        gainNote: String($("mNote").value || "")
      };
    }

    async function saveModal() {
      if (!modalProductId) return;
      try {
        await saveDraft(modalProductId);
        toast("Guardado");
        closeProductModal();
      } catch (e) {
        console.error(e);
        toast("No se pudo guardar");
      }
    }

    $("mClose").onclick = closeProductModal;
    $("mCancel").onclick = closeProductModal;
    $("productModal").addEventListener("click", (e) => {
      if (e.target && e.target.id === "productModal") closeProductModal();
    });
    ["mCost","mPrice","mStock","mSold","mNote"].forEach(id => $(id).addEventListener("input", updateModalPreview));
    $("mSave").onclick = saveModal;

    onAuthStateChanged(auth, async user => {
      if (!user) {
        $("loading").textContent = "Inicia sesion en IN-STORE para ver este panel.";
        return;
      }
      await resolveTenantId(user);
      startProductsListener();
    });
  </script>
</body>
</html>
